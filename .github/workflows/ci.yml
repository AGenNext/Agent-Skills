name: ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce native skill artifact contract
        run: |
          set -euo pipefail

          test -f surreal/skill-source.v1.surql
          grep -q "DEFINE TABLE skill_source_v1 SCHEMAFULL" surreal/skill-source.v1.surql
          grep -q "TYPE record<grammar_context>" surreal/skill-source.v1.surql
          grep -q "source_format" surreal/skill-source.v1.surql
          grep -q "semantic_class" surreal/skill-source.v1.surql
          grep -q "CreativeWork" surreal/skill-source.v1.surql
          grep -q "Agent-Graph" surreal/skill-source.v1.surql
          grep -q "does_not_define_graph_schema" surreal/skill-source.v1.surql

          test -d skills
          test -n "$(find skills -name '*.yaml' -o -name '*.yml' | head -n 1)"

          if grep -R "@context: https://schema.org" skills surreal; then
            echo "Source artifacts must not use plain Schema.org context"
            exit 1
          fi
